name: Build big-pkg-installer

on:
  push:
    branches: [ main ]
    paths:
      - 'pkgbuild/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'pkgbuild/**'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Install base dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            git \
            sudo \
            python \
            python-gobject \
            gtk4 \
            libadwaita \
            pacman-contrib \
            fakeroot \
            zstd \
            libarchive \
            polkit \
            python-pytest \
            rpm-tools

      - name: Create build user
        run: |
          useradd -m -G wheel builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chage -E -1 builder || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: src

      - name: Prepare source and PKGBUILD
        working-directory: src
        run: |
          tar -czf pkgbuild/big-pkg-installer.tar.gz \
            --exclude='pkgbuild' \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='*.tar.gz' \
            .

          cd pkgbuild

          sed -i 's|source=("git+https://github.com/biglinux/big-pkg-installer.git")|source=("big-pkg-installer.tar.gz")|' PKGBUILD

          ls -lh big-pkg-installer.tar.gz
          cat PKGBUILD | grep -E '^(pkgname|pkgver|source)'

          chown -R builder:builder .

      - name: Build package
        working-directory: src/pkgbuild
        run: |
          su builder -c "makepkg -f --noconfirm --skipinteg"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: big-pkg-installer
          path: src/pkgbuild/*.pkg.tar.zst
          if-no-files-found: error

      - name: Show package info
        working-directory: src/pkgbuild
        run: |
          ls -lh *.pkg.tar.zst
          pacman -Qip *.pkg.tar.zst || true
